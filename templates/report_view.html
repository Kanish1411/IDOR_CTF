<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audit Portal — {{ report_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="card wide">
  <span class="badge">Report</span>
  <h2>{{ report_name }}</h2>
  <div class="subtitle">Report contents</div>

  <pre class="report-content">{{ content }}</pre>

  <div class="divider"></div>

  <div class="logout-row">
    <a href="{{ url_for('dashboard', auditor_hash=auditor_hash) }}">&larr; Back to dashboard</a>
  </div>
</div>

</body>
</html>
